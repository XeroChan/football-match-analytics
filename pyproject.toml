[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]

[tool.ruff.lint]
preview = true
select = [
    "correctness",
    "suspicious",
    "complexity",
    "performance",
    "style",
    "security",
    "formatting",
    "pedantic"
]
