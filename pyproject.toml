[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
preview = true
select = [
    "E",
    "W",
    "N",
    "correctness",
    "suspicious",
    "complexity",
    "performance",
    "style",
    "security",
    "formatting",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "FURB189"]

[tool.ruff.lint.pydocstyle]
convention = "google"